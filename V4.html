<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#991515">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192x192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #991515;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.07) 0px, rgba(0,0,0,0.07) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 4px),
      linear-gradient(45deg, #991515, #cc1a1a);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; font-family: monospace; color: #aaa; user-select: none; padding: 20px 0;
  }

  #ui { width: 90vw; max-width: 480px; display: flex; flex-direction: column; align-items: stretch; }

  #nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .nav-arrow {
    width: 40px; height: 32px; border: none; background: none; cursor: pointer;
    color: #4fc3f7; font-size: 26px; line-height: 1; padding: 0;
    text-shadow: 0 0 6px rgba(79,195,247,0.5);
  }
  .nav-arrow:active { color: #8fe0ff; }
  .nav-arrow.inactive { visibility: hidden; pointer-events: none; }

  #title {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    opacity: 0.75; color: rgba(255,255,255,0.25); text-align: center; flex: 1;
  }

  /* Fixed square stack — Page 1's XY pad sets the locked dimensions every
     other page must fill, so switching pages never shifts the title,
     nav arrows, or the TAP/HOLD/BPM/Shape/Blend/FX/Width block below. */
  #page-stack { position: relative; width: 100%; padding-bottom: 100%; height: 0; }
  .page { position: absolute; inset: 0; display: none; flex-direction: column; }
  .page.active { display: flex; }

  #preset-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px; padding: 10px 14px; margin-bottom: 12px; flex: 0 0 auto;
  }
  #preset-bar button {
    background: none; border: none; color: #fff; font-family: monospace;
    font-size: 14px; cursor: pointer; padding: 4px 10px;
  }
  #preset-bar button:disabled { opacity: 0.25; cursor: not-allowed; }
  #preset-label { font-size: 13px; letter-spacing: 2px; font-weight: bold; color: #fff; }

  .sample-grid {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 12px; margin-bottom: 12px;
  }
  .sample-cell { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .sample-pad {
    position: relative; overflow: hidden;
    flex: 1 1 auto; min-height: 0;
    font-family: monospace; color: #fff; background: rgba(0,0,0,0.15);
    border: 2px solid rgba(255,255,255,0.85); border-radius: 10px;
    font-size: 15px; font-weight: bold; letter-spacing: 0.5px; line-height: 1.3;
    padding: 8px; cursor: pointer; text-transform: uppercase;
  }
  .sample-pad:active { background: rgba(255,255,255,0.15); }
  .sample-pad.playing { border-color: cyan; box-shadow: 0 0 10px rgba(0,255,255,0.5); }
  .sample-pad.error { border-color: #ff4444; }
  .sample-pad:disabled, .sample-pad.empty {
    opacity: 0.35; cursor: not-allowed; border-style: dashed;
  }
  /* Cover-crop, never stretched: scales to fill the pad and crops whichever
     dimension overflows (sides for landscape sources, top/bottom for
     portrait) — same behaviour regardless of the source image's own size. */
  .sample-pad-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    filter: grayscale(1); transition: filter 0.2s ease;
    z-index: 0;
  }
  .sample-pad.playing .sample-pad-img { filter: grayscale(0); }
  .sample-pad-label {
    position: relative; z-index: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
  }

  .sample-controls {
    flex: 0 0 auto;
    display: flex; align-items: stretch; gap: 4px;
    background: rgba(0,0,0,0.4); border-radius: 4px; padding: 4px;
  }
  .vol-btn, .mode-btn {
    font-family: monospace; cursor: pointer; border-radius: 3px; height: 30px;
  }
  .vol-btn {
    width: 30px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); color: #ccc; font-size: 14px;
  }
  .mode-btn {
    flex: 1; background: rgba(0,255,255,0.08); border: 1px solid rgba(0,255,255,0.35);
    color: cyan; font-size: 9px; letter-spacing: 1px;
  }
  .vol-btn:active { background: rgba(255,255,255,0.15); }
  .mode-btn:active { background: rgba(0,255,255,0.25); }
  .vol-btn:disabled { opacity: 0.25; cursor: not-allowed; background: rgba(0,0,0,0.3); }

  /* EQ sweep control — not a single-thumb fader like BLEND/FX/WIDTH, but a
     dual-handle band: red = filtered out (cut), teal = the passband between
     the two cyan handles. Dragging a handle moves that cutoff; dragging the
     teal band itself slides both cutoffs together (manual Q-sweep). */
  #eq-track {
    flex: 0 0 auto; margin-bottom: 0;
    background: #6b1414; border: 1px solid rgba(255,255,255,0.08);
  }
  .eq-band {
    position: absolute; top: 0; height: 100%;
    background: rgba(0,255,255,0.12); /* same fill colour as the DEPTH/FX/WIDTH faders */
    cursor: grab;
  }
  .eq-band:active { cursor: grabbing; }
  .eq-handle {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 4px; height: 32px; background: cyan; border-radius: 2px;
    box-shadow: 0 0 6px rgba(0,255,255,0.7);
    cursor: ew-resize; z-index: 2; touch-action: none;
  }

  #wrap { position: absolute; inset: 0; }
  #pad  { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px; cursor: crosshair; display: block; }
  #overlay {
    position: absolute; inset: 0; border-radius: 4px; cursor: pointer;
    background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 2px; color: rgba(0,255,255,0.6);
    border: 1px solid rgba(0,255,255,0.15);
  }

  #controls {
    margin-top: 18px; width: 100%; background: rgba(0,0,0,0.35);
    border-radius: 6px; padding: 14px 16px;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 10px; row-gap: 10px;
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell-label { font-size: 9px; letter-spacing: 1px; opacity: 0.4; text-transform: uppercase; }

  #bpm-display {
    font-size: 14px; letter-spacing: 2px; color: cyan; cursor: ns-resize;
    height: 40px; width: 100%; display: flex; align-items: center; justify-content: center;
  }
  #bpm-input {
    font-size: 14px; letter-spacing: 2px; color: cyan;
    height: 40px; width: 100%; display: none; align-items: center; justify-content: center;
    background: none; border: none; border-bottom: 1px solid cyan;
    text-align: center; font-family: monospace; outline: none; -moz-appearance: textfield;
  }
  #bpm-input::-webkit-outer-spin-button,
  #bpm-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  #tap-btn, #reset-btn, #shape-btn {
    width: 100%; font-family: monospace; letter-spacing: 1px;
    height: 40px; padding: 0; border-radius: 3px; cursor: pointer;
  }
  #tap-btn   { font-size: 10px; background: rgba(0,255,255,0.1);  border: 1px solid rgba(0,255,255,0.3);  color: cyan; }
  #reset-btn { font-size: 10px; background: rgba(255,60,60,0.1);  border: 1px solid rgba(255,60,60,0.3);  color: #ff4444; }
  #reset-btn.hold { background: rgba(0,255,255,0.1); border-color: rgba(0,255,255,0.3); color: cyan; }
  #reset-btn.active-mute { background: rgba(255,60,60,0.4); border-color: #ff4444; color: #fff; }
  #shape-btn { font-size: 8px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); color: #aaa; }
  #tap-btn:active   { background: rgba(0,255,255,0.25); }
  #reset-btn:active { background: rgba(255,60,60,0.25); }
  #shape-btn:active { background: rgba(255,255,255,0.1); }

  #faders {
    margin-top: 10px; width: 100%; background: rgba(0,0,0,0.35);
    border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .fader-row { display: flex; flex-direction: column; gap: 4px; }
  .fader-header { display: flex; justify-content: space-between; align-items: baseline; }
  .fader-label { font-size: 9px; letter-spacing: 1px; opacity: 0.4; text-transform: uppercase; }
  .fader-value { font-size: 9px; letter-spacing: 1px; color: cyan; opacity: 0.7; }
  .fader-track {
    position: relative; width: 100%; height: 40px;
    background: rgba(0,0,0,0.3); border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08); cursor: ew-resize; touch-action: none; overflow: hidden;
  }
  .fader-fill { position: absolute; top: 0; left: 0; height: 100%; background: rgba(0,255,255,0.12); border-radius: 3px; pointer-events: none; }
  .fader-fill-right { position: absolute; top: 0; right: 0; height: 100%; width: 20px; background: transparent; border-radius: 3px; pointer-events: none; }
  .fader-thumb {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 3px; height: 28px; background: cyan; border-radius: 2px;
    pointer-events: none; box-shadow: 0 0 6px rgba(0,255,255,0.6);
  }
  .fader-track::before, .fader-track::after {
    content: ''; position: absolute; top: 50%; transform: translateY(-50%);
    width: 1px; height: 10px; background: rgba(255,255,255,0.12);
  }
  .fader-track::before { left: 0; }
  .fader-track::after  { right: 0; }

  #footer { width: 100%; text-align: center; margin-top: 8px; font-size: 8px; letter-spacing: 1px; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<div id="ui">
<div id="nav-bar">
  <button id="page-back" class="nav-arrow">&#10094;</button>
  <div id="title">Xander Sweep Mini</div>
  <button id="page-fwd" class="nav-arrow">&#10095;</button>
</div>

<div id="page-stack">
<div id="page-1" class="page active">
  <div id="wrap">
    <canvas id="pad" width="340" height="340"></canvas>
    <div id="overlay">BRING THE NOISE</div>
  </div>
</div>

<div id="page-2" class="page">
  <div id="preset-bar">
    <button id="preset-prev">&laquo;&laquo;</button>
    <span id="preset-label">PRESET 1</span>
    <button id="preset-next">&raquo;&raquo;</button>
  </div>
  <div class="sample-grid">
    <div class="sample-cell">
      <button class="sample-pad" data-sample="A"><img class="sample-pad-img" data-sample="A" alt=""><span class="sample-pad-label"></span></button>
      <div class="sample-controls">
        <button class="vol-btn" data-sample="A" data-dir="down">&minus;</button>
        <button class="mode-btn" data-sample="A">ONE HIT</button>
        <button class="vol-btn" data-sample="A" data-dir="up">&plus;</button>
      </div>
    </div>
    <div class="sample-cell">
      <button class="sample-pad" data-sample="B"><img class="sample-pad-img" data-sample="B" alt=""><span class="sample-pad-label"></span></button>
      <div class="sample-controls">
        <button class="vol-btn" data-sample="B" data-dir="down">&minus;</button>
        <button class="mode-btn" data-sample="B">ONE HIT</button>
        <button class="vol-btn" data-sample="B" data-dir="up">&plus;</button>
      </div>
    </div>
    <div class="sample-cell">
      <button class="sample-pad" data-sample="C"><img class="sample-pad-img" data-sample="C" alt=""><span class="sample-pad-label"></span></button>
      <div class="sample-controls">
        <button class="vol-btn" data-sample="C" data-dir="down">&minus;</button>
        <button class="mode-btn" data-sample="C">ONE HIT</button>
        <button class="vol-btn" data-sample="C" data-dir="up">&plus;</button>
      </div>
    </div>
    <div class="sample-cell">
      <button class="sample-pad" data-sample="D"><img class="sample-pad-img" data-sample="D" alt=""><span class="sample-pad-label"></span></button>
      <div class="sample-controls">
        <button class="vol-btn" data-sample="D" data-dir="down">&minus;</button>
        <button class="mode-btn" data-sample="D">ONE HIT</button>
        <button class="vol-btn" data-sample="D" data-dir="up">&plus;</button>
      </div>
    </div>
  </div>
  <div class="fader-track" id="eq-track">
    <div class="eq-band" id="eq-band"></div>
    <div class="eq-handle" id="eq-handle-lo"></div>
    <div class="eq-handle" id="eq-handle-hi"></div>
  </div>
</div>
</div>

<div id="controls">
  <div class="cell"><button id="tap-btn">TAP</button></div>
  <div class="cell"><button id="reset-btn" class="hold">HOLD</button></div>
  <div class="cell">
    <span id="bpm-display">125</span>
    <input id="bpm-input" type="number" min="20" max="300" value="125">
    <span class="cell-label">BPM</span>
  </div>
  <div class="cell">
    <button id="shape-btn">SAWTOOTH</button>
    <span class="cell-label">GATE</span>
  </div>
</div>

<div id="faders">
  <div class="fader-row">
    <div class="fader-header"><span class="fader-label">DEPTH</span><span class="fader-value" id="blend-val">0%</span></div>
    <div class="fader-track" id="blend-track">
      <div class="fader-fill" id="blend-fill"></div>
      <div class="fader-fill-right" id="blend-fill-right"></div>
      <div class="fader-thumb" id="blend-thumb"></div>
    </div>
  </div>
  <div class="fader-row">
    <div class="fader-header"><span class="fader-label">FX</span><span class="fader-value" id="fx-val">0%</span></div>
    <div class="fader-track" id="fx-track">
      <div class="fader-fill" id="fx-fill"></div>
      <div class="fader-fill-right" id="fx-fill-right"></div>
      <div class="fader-thumb" id="fx-thumb"></div>
    </div>
  </div>
  <div class="fader-row">
    <div class="fader-header"><span class="fader-label">WIDTH</span><span class="fader-value" id="width-val">50ms</span></div>
    <div class="fader-track" id="width-track">
      <div class="fader-fill" id="width-fill"></div>
      <div class="fader-fill-right" id="width-fill-right"></div>
      <div class="fader-thumb" id="width-thumb"></div>
    </div>
  </div>
</div>

<div id="footer">TJB 2026</div>
</div>

<script>
  // ── DOM refs ──────────────────────────────────────────────────────────────────
  const padCanvas      = document.getElementById('pad');
  const padCtx         = padCanvas.getContext('2d');
  const overlay        = document.getElementById('overlay');
  const bpmDisplay     = document.getElementById('bpm-display');
  const bpmInput       = document.getElementById('bpm-input');
  const tapBtn         = document.getElementById('tap-btn');
  const resetBtn       = document.getElementById('reset-btn');
  const shapeBtn       = document.getElementById('shape-btn');
  const blendTrack     = document.getElementById('blend-track');
  const blendFill      = document.getElementById('blend-fill');
  const blendFillRight = document.getElementById('blend-fill-right');
  const blendThumb     = document.getElementById('blend-thumb');
  const blendVal       = document.getElementById('blend-val');
  const fxTrack        = document.getElementById('fx-track');
  const fxFill         = document.getElementById('fx-fill');
  const fxFillRight    = document.getElementById('fx-fill-right');
  const fxThumb        = document.getElementById('fx-thumb');
  const fxVal          = document.getElementById('fx-val');
  const widthTrack     = document.getElementById('width-track');
  const widthFill      = document.getElementById('width-fill');
  const widthFillRight = document.getElementById('width-fill-right');
  const widthThumb     = document.getElementById('width-thumb');
  const widthVal       = document.getElementById('width-val');

  const titleEl        = document.getElementById('title');
  const pageBackBtn    = document.getElementById('page-back');
  const pageFwdBtn     = document.getElementById('page-fwd');
  const page1El        = document.getElementById('page-1');
  const page2El        = document.getElementById('page-2');
  const presetPrevBtn  = document.getElementById('preset-prev');
  const presetNextBtn  = document.getElementById('preset-next');
  const presetLabel    = document.getElementById('preset-label');
  const eqTrack        = document.getElementById('eq-track');
  const eqBand         = document.getElementById('eq-band');
  const eqHandleLo     = document.getElementById('eq-handle-lo');
  const eqHandleHi     = document.getElementById('eq-handle-hi');

  // ── Canvas sizing ─────────────────────────────────────────────────────────────
  function resizeCanvas() {
    const size = padCanvas.offsetWidth;
    padCanvas.width = size; padCanvas.height = size;
  }
  resizeCanvas();

  // ── State ─────────────────────────────────────────────────────────────────────
  let audioCtx, lpf, hpf, gainNode;
  let ready = false, px = 0.5, py = 0.5;
  let bpm = 125, blendPct = 0, widthMs = 250, fxRatio = 0, shape = 'sawtooth';
  let held = false, padDragging = false, tapTimes = [];
  // Declared this early (rather than down in the sampler section where it's
  // used) because updatePageUI() reads it via samplerMuteOff() on the very
  // first page-load call, before top-level execution ever reaches the
  // sampler section — a `let` further down would leave it in the temporal
  // dead zone at that point and throw.
  let samplerMuted = false;

  const clamp        = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const diagToLP     = d => 82 * Math.pow(268.3, d);
  const diagToHP     = d => 41 * Math.pow(268.3, d);
  const dottedEighth = () => (60 / bpm) * 0.75;
  // SQUARE runs the gate at double speed (eighth-note feel) vs SAWTOOTH's
  // quarter-note rate at the same BPM.
  const gateFrequency = () => (bpm / 60) * (shape === 'square' ? 2 : 1);

  // ── AudioWorklet noise source ─────────────────────────────────────────────────
  const workletSrc = `
    class NoiseProcessor extends AudioWorkletProcessor {
      process(inputs, outputs) {
        const out = outputs[0][0];
        for (let i = 0; i < out.length; i++) out[i] = Math.random() * 2 - 1;
        return true;
      }
    }
    registerProcessor('noise-processor', NoiseProcessor);
  `;

  // ── Reverb impulse response ───────────────────────────────────────────────────
  function buildImpulse(ctx, secs) {
    const len     = ctx.sampleRate * secs;
    const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = impulse.getChannelData(ch);
      for (let i = 0; i < len; i++)
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    }
    return impulse;
  }

  // ── LFO / master clock management ─────────────────────────────────────────────
  // This is a persistent master clock, not a per-trigger effect: the first XY
  // pad press (Page 1) or sample trigger (Page 2) starts it via
  // ensureMasterClock(), and once started it keeps running — independent of
  // page, independent of whether anything is currently audible — until the
  // app is closed or the user resyncs it with TAP (which restarts the
  // oscillator's phase without touching whether the clock is "on").
  let clockStarted = false;
  function ensureMasterClock() {
    if (clockStarted) return;
    clockStarted = true;
    startLFO();
  }

  function startLFO() {
    stopLFO();
    const osc = audioCtx.createOscillator();
    osc.type = shape;
    osc.frequency.value = gateFrequency();
    osc.connect(audioCtx._gateEdgeFilter);
    osc.start();
    audioCtx._lfoNode = osc;
  }

  function stopLFO() {
    if (audioCtx._lfoNode) {
      try { audioCtx._lfoNode.stop(); } catch(e) {}
      audioCtx._lfoNode.disconnect();
      audioCtx._lfoNode = null;
    }
  }

  // ── Shared effects chain (Page 1 pad AND Page 2 samples both route through
  // this — see ensureSamplerMasterGain() further down for the sampler side) ──
  //
  // Signal chain:
  //  [pad: noiseNode → widthDelay → stereoMerger → lpf → hpf → gainNode]
  //  [samples: per-sample gain → momentary-mute samplerMasterGain]
  //    both → fxInput
  //    → ping-pong delay + reverb (tails decay freely after source release)
  //    → compressor → gateGain (LFO gate/blend, in series — see below)
  //    → masterGain (fixed 0.3) → limiter (hard-caps peaks near 0dBFS) → destination
  //
  // gateGain is driven by an audio-rate crossfade, not by adding to a fixed
  // baseline: at BLEND 0% it sits at a constant 1 (no gating, clean signal
  // passes untouched); at BLEND 100% it *is* the unipolar LFO waveform
  // (0..1), so it fully chops to true silence at the trough. In between,
  // gate(t) = (1 - blend) + blend * unipolarLFO(t). Because it's shared,
  // BLEND/FX/WIDTH/BPM/GATE affect the pad and the sampler identically and
  // simultaneously, on whichever page is active.

  // Shared AudioContext getter — the sample pad (Page 2) can create the context
  // before the noise-pad overlay is ever clicked, and vice versa.
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function ensureEffectsChain() {
    const ctx = getAudioCtx();
    if (ctx._effectsReady) return;

    const fxInput = ctx.createGain(); fxInput.gain.value = 1;
    ctx._fxInput = fxInput;

    // Ping-pong delay
    const pingTime = dottedEighth();
    const delayL   = ctx.createDelay(2.0);
    const delayR   = ctx.createDelay(2.0);
    delayL.delayTime.value = pingTime;
    delayR.delayTime.value = pingTime;
    ctx._pingDelayL = delayL;
    ctx._pingDelayR = delayR;

    const fbL = ctx.createGain(); fbL.gain.value = 0.35;
    const fbR = ctx.createGain(); fbR.gain.value = 0.35;
    fxInput.connect(delayL);
    delayL.connect(fbR); fbR.connect(delayR);
    delayR.connect(fbL); fbL.connect(delayL);

    const pingDry  = ctx.createGain(); pingDry.gain.value  = 1.0;
    const pingWetL = ctx.createGain(); pingWetL.gain.value = 0;
    const pingWetR = ctx.createGain(); pingWetR.gain.value = 0;
    ctx._pingDry  = pingDry;
    ctx._pingWetL = pingWetL;
    ctx._pingWetR = pingWetR;

    fxInput.connect(pingDry);
    delayL.connect(pingWetL);
    delayR.connect(pingWetR);

    const pingMerger = ctx.createChannelMerger(2);
    pingDry.connect(pingMerger,  0, 0); pingDry.connect(pingMerger,  0, 1);
    pingWetL.connect(pingMerger, 0, 0); pingWetR.connect(pingMerger, 0, 1);

    // Reverb
    const convolver = ctx.createConvolver();
    convolver.buffer = buildImpulse(ctx, 5);
    const reverbWet = ctx.createGain(); reverbWet.gain.value = 0;
    const reverbDry = ctx.createGain(); reverbDry.gain.value = 1;
    ctx._reverbWet = reverbWet;
    ctx._reverbDry = reverbDry;
    pingMerger.connect(reverbDry);
    pingMerger.connect(convolver); convolver.connect(reverbWet);

    // Compressor
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4;
    comp.attack.value = 0.005;  comp.release.value = 0.15; comp.knee.value = 6;
    reverbDry.connect(comp);
    reverbWet.connect(comp);

    // ── LFO gate / blend — a true in-series gate stage ────────────────────────
    // unipolarLFO(t) = 0.5*osc(t) + 0.5, i.e. the oscillator remapped from
    // [-1..1] to [0..1] so it can act as a 0..1 gate rather than a tremolo
    // added on top of a fixed baseline (which is what let clean signal bleed
    // through at BLEND 100% before).
    // Edge smoother — the raw square/sawtooth osc has vertical (zero-time)
    // transitions; multiplying audio straight through a zero-time gate edge
    // is what causes the audible click/"clipping" crack on every gate open
    // and close. A short lowpass on the modulator itself (not on the audio
    // signal it's gating) rounds those edges to a ~1ms transition — fast
    // enough to still read as a square/saw gate, slow enough to remove the
    // discontinuity. Fixed cutoff, independent of BPM/shape, on purpose:
    // the goal is a constant, short edge time, not a tempo-relative one.
    const gateEdgeFilter = ctx.createBiquadFilter();
    gateEdgeFilter.type = 'lowpass';
    gateEdgeFilter.frequency.value = 200;
    gateEdgeFilter.Q.value = 0.707;
    ctx._gateEdgeFilter = gateEdgeFilter;

    const oscScaleGain = ctx.createGain(); oscScaleGain.gain.value = 0.5;
    const unipolarOffset = ctx.createConstantSource(); unipolarOffset.offset.value = 0.5;
    const unipolarSum = ctx.createGain(); unipolarSum.gain.value = 1;
    gateEdgeFilter.connect(oscScaleGain);
    oscScaleGain.connect(unipolarSum);
    unipolarOffset.connect(unipolarSum);
    unipolarOffset.start();
    ctx._oscScaleGain = oscScaleGain;

    // gate(t) = (1 - blend) + blend * unipolarLFO(t) — two terms summed
    // directly into gateGain's gain AudioParam (its own .value stays 0).
    const lfoBlendGain = ctx.createGain(); lfoBlendGain.gain.value = 0; // set by applyBlend()
    unipolarSum.connect(lfoBlendGain);

    const dryConst = ctx.createConstantSource(); dryConst.offset.value = 1; // set by applyBlend()
    dryConst.start();

    const gateGain = ctx.createGain(); gateGain.gain.value = 0;
    lfoBlendGain.connect(gateGain.gain);
    dryConst.connect(gateGain.gain);
    ctx._lfoBlendGain = lfoBlendGain;
    ctx._dryConst = dryConst;
    ctx._lfoNode = null;

    comp.connect(gateGain);

    // Master gain — fixed level — followed by a hard limiter so peaks never
    // exceed roughly -0.1dBFS regardless of how the faders above are set.
    const masterGain = ctx.createGain();
    masterGain.gain.value = 0.3;
    ctx._masterGain = masterGain;

    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -0.1; limiter.knee.value = 0;
    limiter.ratio.value = 20;       limiter.attack.value = 0.002; limiter.release.value = 0.05;

    gateGain.connect(masterGain);
    masterGain.connect(limiter);
    limiter.connect(ctx.destination);

    ctx._effectsReady = true;
  }

  // ── Page 1 pad audio (noise source + filters + on/off gate only) ─────────────
  async function initAudio() {
    getAudioCtx();
    ensureEffectsChain();

    const blob    = new Blob([workletSrc], { type: 'application/javascript' });
    const blobURL = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(blobURL);
    URL.revokeObjectURL(blobURL);

    const noiseNode = new AudioWorkletNode(audioCtx, 'noise-processor');

    // Width delay — offsets R channel to create stereo spread
    const widthDelay = audioCtx.createDelay(0.6);
    widthDelay.delayTime.value = widthMs / 1000;
    audioCtx._delayNode = widthDelay;

    // Merge mono noise into stereo: L direct, R via delay
    const stereoMerger = audioCtx.createChannelMerger(2);
    noiseNode.connect(stereoMerger, 0, 0);
    noiseNode.connect(widthDelay);
    widthDelay.connect(stereoMerger, 0, 1);

    // Filters on the merged stereo stream
    lpf = audioCtx.createBiquadFilter(); lpf.type = 'lowpass';  lpf.Q.value = 0.5;
    hpf = audioCtx.createBiquadFilter(); hpf.type = 'highpass'; hpf.Q.value = 0.5;
    stereoMerger.connect(lpf); lpf.connect(hpf);

    // Single gain node — pad on/off; the shared FX chain is downstream so
    // tails decay freely after release
    gainNode = audioCtx.createGain(); gainNode.gain.value = 0;
    hpf.connect(gainNode);
    gainNode.connect(audioCtx._fxInput);

    ready = true;
  }

  // ── Filter update ─────────────────────────────────────────────────────────────
  function updateFilters() {
    const d = (px + py) / 2;
    let lp  = clamp(diagToLP(d), 82, 22000);
    let hp  = clamp(diagToHP(d), 41, 11000);
    hp = Math.max(Math.min(hp, lp * 0.9), 41);
    const t = audioCtx.currentTime;
    lpf.frequency.setTargetAtTime(lp, t, 0.02);
    hpf.frequency.setTargetAtTime(hp, t, 0.02);
  }

  // ── Blend ─────────────────────────────────────────────────────────────────────
  function applyBlend() {
    if (!audioCtx?._lfoBlendGain) return;
    const ratio = blendPct / 100;
    const t = audioCtx.currentTime;
    // gate(t) = (1 - blend) + blend * unipolarLFO(t)
    audioCtx._lfoBlendGain.gain.setTargetAtTime(ratio, t, 0.02);
    audioCtx._dryConst.offset.setTargetAtTime(1 - ratio, t, 0.02);
  }

  // ── FX ────────────────────────────────────────────────────────────────────────
  function applyFX() {
    if (!audioCtx?._pingWetL) return;
    const t = audioCtx.currentTime;
    if (fxRatio <= 0.5) {
      const wet = fxRatio * 2;
      audioCtx._pingWetL.gain.setTargetAtTime(wet * 0.5, t, 0.05);
      audioCtx._pingWetR.gain.setTargetAtTime(wet * 0.5, t, 0.05);
      audioCtx._pingDry.gain.setTargetAtTime(1.0, t, 0.05);
      audioCtx._reverbWet.gain.setTargetAtTime(0, t, 0.05);
      audioCtx._reverbDry.gain.setTargetAtTime(1.0, t, 0.05);
    } else {
      const rv = (fxRatio - 0.5) * 2;
      audioCtx._pingWetL.gain.setTargetAtTime(0.5, t, 0.05);
      audioCtx._pingWetR.gain.setTargetAtTime(0.5, t, 0.05);
      audioCtx._pingDry.gain.setTargetAtTime(1.0, t, 0.05);
      audioCtx._reverbWet.gain.setTargetAtTime(rv, t, 0.05);
      audioCtx._reverbDry.gain.setTargetAtTime(1.0 - rv * 0.5, t, 0.05);
    }
  }

  // ── Pad fade in/out ───────────────────────────────────────────────────────────
  function fadeIn() {
    ensureMasterClock();
    audioCtx.resume().then(() => {
      const t = audioCtx.currentTime;
      gainNode.gain.cancelScheduledValues(t);
      gainNode.gain.setValueAtTime(0, t);
      gainNode.gain.linearRampToValueAtTime(1.0, t + 0.025);
    });
  }

  function fadeOut() {
    const t = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(t);
    gainNode.gain.setValueAtTime(gainNode.gain.value, t);
    gainNode.gain.linearRampToValueAtTime(0, t + 0.003);
    // NB: the master clock is persistent now — it does not stop here.
  }

  // ── BPM ───────────────────────────────────────────────────────────────────────
  function updateBPM(val) {
    bpm = clamp(Math.round(val), 20, 300);
    bpmDisplay.textContent = bpm;
    bpmInput.value = bpm;
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    if (audioCtx._lfoNode)
      audioCtx._lfoNode.frequency.setTargetAtTime(gateFrequency(), t, 0.02);
    if (audioCtx._pingDelayL) {
      const pt = dottedEighth();
      audioCtx._pingDelayL.delayTime.setTargetAtTime(pt, t, 0.02);
      audioCtx._pingDelayR.delayTime.setTargetAtTime(pt, t, 0.02);
    }
  }

  let bpmDragging = false, bpmStartY = 0, bpmStartVal = 125;

  bpmDisplay.addEventListener('mousedown', e => {
    bpmDragging = true; bpmStartY = e.clientY; bpmStartVal = bpm; e.preventDefault();
  });
  bpmDisplay.addEventListener('wheel', e => {
    e.preventDefault(); updateBPM(bpm - Math.sign(e.deltaY));
  }, { passive: false });
  bpmDisplay.addEventListener('dblclick', () => {
    bpmDisplay.style.display = 'none';
    bpmInput.style.display = 'flex';
    bpmInput.focus(); bpmInput.select();
  });
  function commitBPM() {
    const v = parseInt(bpmInput.value);
    if (!isNaN(v)) updateBPM(v);
    bpmInput.style.display = 'none';
    bpmDisplay.style.display = 'flex';
  }
  bpmInput.addEventListener('keydown', e => {
    if (e.key === 'Enter')  commitBPM();
    if (e.key === 'Escape') { bpmInput.style.display = 'none'; bpmDisplay.style.display = 'flex'; }
  });
  bpmInput.addEventListener('blur', commitBPM);

  // TAP tempo
  tapBtn.addEventListener('click', () => {
    // Every tap resyncs the master clock's phase — "beat 1" lands exactly on
    // this tap — but only if the clock has actually been started (a tap
    // before the first pad press / sample trigger doesn't start it early).
    if (clockStarted) startLFO();

    const now = performance.now();
    tapTimes.push(now);
    if (tapTimes.length > 6) tapTimes.shift();
    if (tapTimes.length >= 4) {
      const gaps = [];
      for (let i = 1; i < tapTimes.length; i++) gaps.push(tapTimes[i] - tapTimes[i-1]);
      updateBPM(60000 / (gaps.reduce((a,b) => a+b,0) / gaps.length));
    }
    setTimeout(() => { if (performance.now() - tapTimes[tapTimes.length-1] > 3000) tapTimes = []; }, 3100);
  });

  // GATE shape
  shapeBtn.addEventListener('click', () => {
    shape = shape === 'sawtooth' ? 'square' : 'sawtooth';
    shapeBtn.textContent = shape.toUpperCase();
    if (audioCtx?._lfoNode) {
      audioCtx._lfoNode.type = shape;
      audioCtx._lfoNode.frequency.setTargetAtTime(gateFrequency(), audioCtx.currentTime, 0.02);
    }
  });

  // HOLD / RESET — Page 1 (XY pad): click-toggle HOLD/MUTE, as before.
  // Page 2 (Sampler): this same button becomes a momentary MUTE for sample
  // output only — see the "Sampler momentary mute" block further down.
  resetBtn.addEventListener('click', () => {
    if (currentPage !== 1) return;
    if (!ready) return;
    if (!held) {
      held = true;
      fadeIn(); // also starts the master clock on first-ever activation
      resetBtn.textContent = 'MUTE'; resetBtn.classList.remove('hold');
    } else {
      held = false;
      fadeOut();
      // NB: no longer suspending audioCtx here — the AudioContext is shared
      // with the Sampler page now, and suspending it would silence that too.
      // The master clock keeps running regardless (see ensureMasterClock()).
      resetBtn.textContent = 'HOLD'; resetBtn.classList.add('hold');
    }
  });

  function updateResetBtnForPage1() {
    if (held) { resetBtn.textContent = 'MUTE'; resetBtn.classList.remove('hold'); }
    else      { resetBtn.textContent = 'HOLD'; resetBtn.classList.add('hold'); }
  }

  // ── Faders ────────────────────────────────────────────────────────────────────
  const FADER_INSET = 20;

  function trackRatio(track, clientX) {
    const rb     = track.getBoundingClientRect();
    const travel = rb.width - FADER_INSET * 2;
    return clamp((clientX - rb.left - FADER_INSET) / travel, 0, 1);
  }

  function setFaderUI(fill, fillRight, thumb, ratio) {
    fill.style.left   = '0';
    fill.style.width  = `calc(${FADER_INSET}px + ${ratio} * (100% - ${FADER_INSET * 2}px))`;
    thumb.style.left  = `calc(${FADER_INSET}px + ${ratio} * (100% - ${FADER_INSET * 2}px) - 1.5px)`;
    fillRight.style.background = ratio >= 1 ? 'rgba(0,255,255,0.12)' : 'transparent';
  }

  function setBlend(ratio) {
    blendPct = Math.round(ratio * 100);
    setFaderUI(blendFill, blendFillRight, blendThumb, ratio);
    blendVal.textContent = blendPct + '%';
    applyBlend();
  }

  function setFX(ratio) {
    fxRatio = ratio;
    setFaderUI(fxFill, fxFillRight, fxThumb, ratio);
    const pct = Math.round(ratio * 100);
    fxVal.textContent = pct + '%';
    applyFX();
  }

  // WIDTH is one shared fader with two different meanings depending on page:
  //  Page 1 (pad): unchanged mono→stereo delay trick on the synthesized noise.
  //  Page 2 (sampler): a proper mid-side stereo width control over the
  //    (already-stereo-capable) decoded sample audio — ratio 0 = mono,
  //    0.5 = 100% (unity/original stereo image), 1 = 200% (exaggerated).
  //    Mid/side math degrades safely to a no-op on mono source material
  //    (L===R ⇒ side=0 regardless of width amount).
  let widthRatio = widthMs / 500;

  function updateWidthLabel() {
    if (currentPage === 2) {
      widthVal.textContent = widthRatio <= 0 ? 'MONO' : Math.round(widthRatio * 200) + '%';
    } else {
      widthVal.textContent = widthMs <= 0 ? 'MONO' : widthMs + 'ms';
    }
  }

  function setWidth(ratio) {
    widthRatio = ratio;
    widthMs = Math.round(ratio * 500);
    setFaderUI(widthFill, widthFillRight, widthThumb, ratio);
    updateWidthLabel();
    if (audioCtx?._delayNode)
      audioCtx._delayNode.delayTime.setTargetAtTime(widthMs / 1000, audioCtx.currentTime, 0.02);
    applySamplerWidth(ratio);
  }

  // ── Sampler stereo width (mid-side matrix) ────────────────────────────────
  // outL = L*(0.5+0.5*amount) + R*(0.5-0.5*amount)
  // outR = L*(0.5-0.5*amount) + R*(0.5+0.5*amount)
  // amount=0 → mono (L=R=mid); amount=1 → passthrough stereo; amount=2 → 200%.
  function ensureSamplerWidthStage() {
    const ctx = getAudioCtx();
    if (ctx._widthReady) return;
    ensureSamplerEQStage(); // EQ sits directly before the shared FX chain
    const splitter = ctx.createChannelSplitter(2);
    const merger   = ctx.createChannelMerger(2);
    const gLL = ctx.createGain(), gRL = ctx.createGain();
    const gLR = ctx.createGain(), gRR = ctx.createGain();
    splitter.connect(gLL, 0); gLL.connect(merger, 0, 0);
    splitter.connect(gRL, 1); gRL.connect(merger, 0, 0);
    splitter.connect(gLR, 0); gLR.connect(merger, 0, 1);
    splitter.connect(gRR, 1); gRR.connect(merger, 0, 1);
    merger.connect(ctx._eqInput);
    ctx._widthSplitter = splitter;
    ctx._widthGains = { LL: gLL, RL: gRL, LR: gLR, RR: gRR };
    ctx._widthReady = true;
    applySamplerWidth(widthRatio);
  }

  function applySamplerWidth(ratio) {
    const ctx = audioCtx;
    if (!ctx?._widthReady) return;
    const amount = ratio * 2;
    const t = ctx.currentTime;
    const same = 0.5 + 0.5 * amount, cross = 0.5 - 0.5 * amount;
    ctx._widthGains.LL.gain.setTargetAtTime(same,  t, 0.02);
    ctx._widthGains.RR.gain.setTargetAtTime(same,  t, 0.02);
    ctx._widthGains.RL.gain.setTargetAtTime(cross, t, 0.02);
    ctx._widthGains.LR.gain.setTargetAtTime(cross, t, 0.02);
  }

  setFaderUI(blendFill, blendFillRight, blendThumb, blendPct / 100);
  setFaderUI(fxFill,    fxFillRight,    fxThumb,    fxRatio);
  setFaderUI(widthFill, widthFillRight, widthThumb, widthMs / 500);
  // (initial width label is set by updatePageUI()'s call to updateWidthLabel()
  // further down, once `currentPage` exists — calling it here would hit the
  // same kind of TDZ ReferenceError as the earlier samplerMuted bug.)

  let blendActive = false, fxActive = false, widthActive = false;

  blendTrack.addEventListener('mousedown', e => { blendActive = true; setBlend(trackRatio(blendTrack, e.clientX)); e.stopPropagation(); });
  fxTrack.addEventListener('mousedown',    e => { fxActive    = true; setFX(trackRatio(fxTrack, e.clientX));       e.stopPropagation(); });
  widthTrack.addEventListener('mousedown', e => { widthActive = true; setWidth(trackRatio(widthTrack, e.clientX)); e.stopPropagation(); });

  function makeFaderTouch(track, setActive, setter) {
    track.addEventListener('touchstart', e => { e.preventDefault(); setActive(true);  setter(trackRatio(track, e.touches[0].clientX)); }, { passive: false });
    track.addEventListener('touchmove',  e => { e.preventDefault();                    setter(trackRatio(track, e.touches[0].clientX)); }, { passive: false });
    track.addEventListener('touchend',   () => setActive(false));
  }
  makeFaderTouch(blendTrack, v => blendActive = v, setBlend);
  makeFaderTouch(fxTrack,    v => fxActive    = v, setFX);
  makeFaderTouch(widthTrack, v => widthActive = v, setWidth);

  window.addEventListener('mousemove', e => {
    if (bpmDragging) updateBPM(bpmStartVal + (bpmStartY - e.clientY));
    if (blendActive) setBlend(trackRatio(blendTrack, e.clientX));
    if (fxActive)    setFX(trackRatio(fxTrack, e.clientX));
    if (widthActive) setWidth(trackRatio(widthTrack, e.clientX));
    if (padDragging) padPos(e);
  });
  window.addEventListener('mouseup', () => {
    bpmDragging = false; blendActive = false; fxActive = false; widthActive = false;
    if (padDragging) { padDragging = false; if (!held) fadeOut(); }
  });

  // ── XY Pad ────────────────────────────────────────────────────────────────────
  function padPos(e) {
    const rb = padCanvas.getBoundingClientRect();
    px = clamp((e.clientX - rb.left) / rb.width,      0, 1);
    py = clamp(1 - (e.clientY - rb.top) / rb.height,  0, 1);
    updateFilters();
  }

  padCanvas.addEventListener('mousedown', e => {
    if (!ready) return; padDragging = true; padPos(e); fadeIn();
  });
  padCanvas.addEventListener('touchstart', e => {
    e.preventDefault(); if (!ready) return;
    const t = e.touches[0], rb = padCanvas.getBoundingClientRect();
    px = clamp((t.clientX - rb.left) / rb.width,     0, 1);
    py = clamp(1 - (t.clientY - rb.top) / rb.height, 0, 1);
    updateFilters(); padDragging = true; fadeIn();
  }, { passive: false });
  padCanvas.addEventListener('touchmove', e => {
    e.preventDefault(); if (!padDragging) return;
    const t = e.touches[0], rb = padCanvas.getBoundingClientRect();
    px = clamp((t.clientX - rb.left) / rb.width,     0, 1);
    py = clamp(1 - (t.clientY - rb.top) / rb.height, 0, 1);
    updateFilters();
  }, { passive: false });
  padCanvas.addEventListener('touchend', () => {
    padDragging = false; if (!held) fadeOut();
  });

  // ── Overlay ───────────────────────────────────────────────────────────────────
  overlay.addEventListener('click', () => {
    initAudio().then(() => {
      overlay.style.display = 'none';
    }).catch(err => {
      console.error('Audio init failed:', err);
      overlay.textContent = 'AUDIO ERROR — CHECK CONSOLE';
    });
  }, { once: true });

  // ── Pad draw loop ─────────────────────────────────────────────────────────────
  function drawPad() {
    const W = padCanvas.width, H = padCanvas.height;
    const bg = padCtx.createLinearGradient(0, H, W, 0);
    bg.addColorStop(0, '#0a0a14'); bg.addColorStop(1, '#1a2a4a');
    padCtx.fillStyle = bg; padCtx.fillRect(0, 0, W, H);

    padCtx.strokeStyle = 'rgba(255,255,255,0.06)'; padCtx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      padCtx.beginPath(); padCtx.moveTo(W*i/4, 0); padCtx.lineTo(W*i/4, H); padCtx.stroke();
      padCtx.beginPath(); padCtx.moveTo(0, H*i/4); padCtx.lineTo(W, H*i/4); padCtx.stroke();
    }

    const pcx = px * W, pcy = (1 - py) * H;
    const active = ready && audioCtx?.state === 'running' && gainNode?.gain.value > 0.01;

    padCtx.strokeStyle = `rgba(0,255,255,${active ? 0.15 : 0.04})`; padCtx.lineWidth = 1;
    padCtx.beginPath(); padCtx.moveTo(pcx, 0); padCtx.lineTo(pcx, H); padCtx.stroke();
    padCtx.beginPath(); padCtx.moveTo(0, pcy); padCtx.lineTo(W, pcy); padCtx.stroke();

    const g = padCtx.createRadialGradient(pcx, pcy, 0, pcx, pcy, 40);
    g.addColorStop(0, `rgba(0,255,255,${active ? 0.25 : 0.06})`);
    g.addColorStop(1, 'rgba(0,255,255,0)');
    padCtx.fillStyle = g; padCtx.beginPath(); padCtx.arc(pcx, pcy, 40, 0, Math.PI*2); padCtx.fill();

    padCtx.strokeStyle = active ? 'rgba(0,255,255,1)' : 'rgba(0,255,255,0.3)'; padCtx.lineWidth = 1.5;
    padCtx.beginPath(); padCtx.arc(pcx, pcy, 10, 0, Math.PI*2); padCtx.stroke();

    padCtx.fillStyle = active ? 'white' : 'rgba(255,255,255,0.3)';
    padCtx.beginPath(); padCtx.arc(pcx, pcy, 3, 0, Math.PI*2); padCtx.fill();

    requestAnimationFrame(drawPad);
  }
  drawPad();

  // ── Page navigation (Page 1 = Sweep pad, Page 2 = Sampler, 3+ TBD) ─────────────
  const TOTAL_PAGES = 2;
  let currentPage = 1;
  const pages = { 1: page1El, 2: page2El };

  const PAGE_TITLES = { 1: 'Xander Sweep Mini', 2: 'Xander Sampler' };

  function updatePageUI() {
    Object.entries(pages).forEach(([n, el]) => el.classList.toggle('active', Number(n) === currentPage));
    pageBackBtn.classList.toggle('inactive', currentPage <= 1);
    pageFwdBtn.classList.toggle('inactive', currentPage >= TOTAL_PAGES);
    titleEl.textContent = PAGE_TITLES[currentPage] || '';
    updateWidthLabel();

    // The RESET/HOLD button's role is page-dependent: Page 1 keeps the
    // original HOLD/MUTE toggle; Page 2 repurposes it as a momentary mute
    // for sample output only (see "Sampler momentary mute" below).
    if (currentPage === 1) {
      samplerMuteOff();
      updateResetBtnForPage1();
    } else {
      resetBtn.textContent = 'MUTE';
      resetBtn.classList.remove('hold');
    }
  }
  // The XY pad must not keep generating noise once the user leaves Page 1 —
  // forcibly release any held/dragged pad state before the page switches.
  function forceStopPad() {
    if (!ready) return;
    if (padDragging) {
      padDragging = false;
      fadeOut();
    }
    if (held) {
      held = false;
      fadeOut(); // pad's own gain fades to silence; the master clock keeps running
      resetBtn.textContent = 'HOLD';
      resetBtn.classList.add('hold');
    }
  }

  function goToPage(n) {
    const target = clamp(n, 1, TOTAL_PAGES);
    if (currentPage === 1 && target !== 1) forceStopPad();
    if (currentPage === 2 && target !== 2) forceStopAllSamples();
    currentPage = target;
    updatePageUI();
  }
  pageBackBtn.addEventListener('click', () => goToPage(currentPage - 1));
  pageFwdBtn.addEventListener('click',  () => goToPage(currentPage + 1));
  updatePageUI();

  // ── Preset data (Sampler page) — loaded from samples.json ───────────────────────
  // NB: this is deliberately NOT named manifest.json — that filename is already
  // taken by the PWA web-app manifest (see <link rel="manifest"> in <head>),
  // which has its own fixed schema for icons/install behaviour. samples.json is
  // a separate file, sampler-specific, living alongside it in the same /xsmini/
  // folder. A static GitHub Pages host can't be directory-listed at runtime, so
  // samples.json is the one source of truth for (a) how many presets exist —
  // TOTAL_PRESETS is derived from however many entries it has, never hardcoded,
  // so adding a preset is a content-only change — and (b) each sample's actual
  // filename, extension included, since audio files may be a mix of
  // .mp3/.wav/.ogg/.flac and there's no way to assume one format. Expected shape:
  //   { "presets": { "1": { "A": { "file": "p01_A.mp3", "image": "p01_A.jpg",
  //                                "durationSec": 12.4 }, "B": {...}, ... }, "2": {...} } }
  // durationSec is stored for display only (e.g. showing a length before the
  // file's ever been fetched) — it is NEVER used for playback timing. The
  // ambient LOOP retrigger above always uses the real decoded buffer's own
  // .duration instead, so a stale samples.json value can't cause audible drift.
  const AUDIO_BASE   = 'https://tjbofficial.github.io/xsmini/audio/';
  const IMAGE_BASE   = 'https://tjbofficial.github.io/xsmini/images/';
  const SAMPLES_URL  = 'https://tjbofficial.github.io/xsmini/samples.json';

  let TOTAL_PRESETS  = 0;
  let presetIndex    = 1;
  let PRESETS        = {};
  let manifestReady  = false;

  async function loadManifest() {
    try {
      const res = await fetch(SAMPLES_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const manifest = await res.json();
      const presets = {};
      Object.entries(manifest.presets || {}).forEach(([presetNum, samples]) => {
        presets[presetNum] = {};
        Object.entries(samples).forEach(([key, entry]) => {
          presets[presetNum][key] = {
            // A missing/empty `file` marks this bank as intentionally blank
            // for this preset — no fallback URL is built for it.
            audio: entry.file ? AUDIO_BASE + entry.file : null,
            image: entry.image ? IMAGE_BASE + entry.image : null,
            durationSec: typeof entry.durationSec === 'number' ? entry.durationSec : null,
          };
        });
      });
      PRESETS = presets;
      TOTAL_PRESETS = Object.keys(PRESETS).length;
      manifestReady = true;
    } catch (err) {
      console.error('Failed to load samples.json — Sampler page has no presets available', err);
      PRESETS = {};
      TOTAL_PRESETS = 0;
      manifestReady = false;
    }
    presetIndex = clamp(presetIndex, 1, Math.max(TOTAL_PRESETS, 1));
    updateSamplePadLabels();
    updatePresetUI();
  }

  function updatePresetUI() {
    if (!manifestReady)        presetLabel.textContent = 'LOADING…';
    else if (!TOTAL_PRESETS)   presetLabel.textContent = 'NO PRESETS';
    else                       presetLabel.textContent = `PRESET ${presetIndex}`;
    presetPrevBtn.disabled = !manifestReady || presetIndex <= 1;
    presetNextBtn.disabled = !manifestReady || presetIndex >= TOTAL_PRESETS;
  }
  function goToPreset(n) {
    if (!manifestReady || !TOTAL_PRESETS) return;
    const clamped = clamp(n, 1, TOTAL_PRESETS);
    if (clamped === presetIndex) return;
    // Switching presets quick-fade-stops anything currently playing and
    // resets each pad's volume trim back to unity — the new preset always
    // starts clean rather than inheriting levels/voices from the last one.
    forceStopAllSamples();
    presetIndex = clamped;
    Object.keys(sampleState).forEach(key => {
      const st = sampleState[key];
      st.buffer = null;      // old buffers are stale — clear the cache so samples reload
      st.loading = null;
      st.volumeStep = 0;
      if (st.gain) st.gain.gain.setTargetAtTime(stepToGain(0), getAudioCtx().currentTime, 0.01);
      updateVolumeButtons(key);
    });
    updateSamplePadLabels();
    updatePresetUI();
  }
  presetPrevBtn.addEventListener('click', () => goToPreset(presetIndex - 1));
  presetNextBtn.addEventListener('click', () => goToPreset(presetIndex + 1));
  updatePresetUI(); // shows LOADING… immediately; loadManifest() below fills it in
  loadManifest();

  function updateSamplePadLabels() {
    document.querySelectorAll('.sample-pad').forEach(btn => {
      const key = btn.dataset.sample;
      const label = btn.querySelector('.sample-pad-label');
      const img = btn.querySelector('.sample-pad-img');
      const entry = PRESETS[presetIndex]?.[key];
      // A pad only needs a text label when it's genuinely blank for this
      // preset — otherwise the sample image speaks for itself. "Blank"
      // means the manifest has finished loading, this preset exists, and
      // this letter either isn't in it or has no audio file.
      const isEmpty = manifestReady && !!TOTAL_PRESETS && (!entry || !entry.audio);

      label.textContent = isEmpty ? 'EMPTY' : '';
      btn.disabled = isEmpty;
      btn.classList.toggle('empty', isEmpty);

      if (entry?.image) {
        img.onerror = () => { img.style.visibility = 'hidden'; }; // broken URL — fall back to plain background
        img.style.visibility = 'visible';
        img.src = entry.image;
      } else {
        img.removeAttribute('src');
        img.style.visibility = 'hidden'; // no image for this entry — plain background shows through
      }
    });
  }

  // ── Sampler engine ───────────────────────────────────────────────────────────────
  const SAMPLE_KEYS = ['A', 'B', 'C', 'D'];
  const sampleState = {};
  SAMPLE_KEYS.forEach(key => {
    sampleState[key] = { buffer: null, loading: null, gain: null, mode: 'ONE HIT', loopSession: null, oneHitVoice: null, retriggerVoices: new Set(), volumeStep: 0 };
  });

  // All sample gains route through one shared master gain so the Page-2
  // MUTE button can silence every sample at once without touching each
  // sample's own volume level.
  let samplerMasterGain = null;
  function ensureSamplerMasterGain() {
    const ctx = getAudioCtx();
    ensureEffectsChain();
    if (!samplerMasterGain) {
      samplerMasterGain = ctx.createGain();
      samplerMasterGain.gain.value = 1;
      // Momentary mute stage → sampler-only stereo WIDTH matrix → the shared
      // FX/compressor/gate/limiter chain (same one the XY pad uses), rather
      // than straight to destination.
      ensureSamplerWidthStage();
      samplerMasterGain.connect(ctx._widthSplitter);
    }
    return samplerMasterGain;
  }

  // Per-sample trim: ±5 steps of 3dB each (±15dB total), 0 = unity gain (0dB).
  // Capped and disabled at the limit rather than silently clamping forever,
  // so the buttons visibly stop responding once you've hit the ceiling/floor.
  const VOLUME_STEP_DB  = 3;
  const VOLUME_STEP_MAX = 5;
  const stepToGain = step => Math.pow(10, (step * VOLUME_STEP_DB) / 20);

  function updateVolumeButtons(key) {
    const st = sampleState[key];
    const downBtn = document.querySelector(`.vol-btn[data-sample="${key}"][data-dir="down"]`);
    const upBtn   = document.querySelector(`.vol-btn[data-sample="${key}"][data-dir="up"]`);
    downBtn.disabled = st.volumeStep <= -VOLUME_STEP_MAX;
    upBtn.disabled   = st.volumeStep >= VOLUME_STEP_MAX;
  }

  function ensureSampleGain(key) {
    const ctx = getAudioCtx();
    const st = sampleState[key];
    if (!st.gain) {
      st.gain = ctx.createGain();
      st.gain.gain.value = stepToGain(st.volumeStep);
      st.gain.connect(ensureSamplerMasterGain());
    }
    return st.gain;
  }

  // ── Sampler momentary mute (Page 2's repurposed RESET/HOLD button) ────────────
  // Press-and-hold silences sample output only; the XY pad's own audio chain
  // (gainNode/masterGain on Page 1) is untouched, so it keeps running under
  // the hood if it was already held when the user switched pages.
  // (samplerMuted itself is declared near the top of the script — see comment there.)
  function samplerMuteOn() {
    if (samplerMuted) return;
    samplerMuted = true;
    ensureSamplerMasterGain().gain.setTargetAtTime(0, getAudioCtx().currentTime, 0.005);
    resetBtn.classList.add('active-mute');
  }
  function samplerMuteOff() {
    if (!samplerMuted) return;
    samplerMuted = false;
    if (samplerMasterGain) samplerMasterGain.gain.setTargetAtTime(1, getAudioCtx().currentTime, 0.01);
    resetBtn.classList.remove('active-mute');
  }
  resetBtn.addEventListener('mousedown', e => { if (currentPage === 2) { e.preventDefault(); samplerMuteOn(); } });
  resetBtn.addEventListener('mouseup',   () => { if (currentPage === 2) samplerMuteOff(); });
  resetBtn.addEventListener('mouseleave',() => { if (currentPage === 2) samplerMuteOff(); });
  resetBtn.addEventListener('touchstart',e => { if (currentPage === 2) { e.preventDefault(); samplerMuteOn(); } }, { passive: false });
  resetBtn.addEventListener('touchend',  () => { if (currentPage === 2) samplerMuteOff(); });
  resetBtn.addEventListener('touchcancel', () => { if (currentPage === 2) samplerMuteOff(); });

  // ── Ambient LOOP retrigger ─────────────────────────────────────────────────────
  // LOOP mode is meant for ambient, non-seamless field recordings (waves, wind,
  // rain) rather than tightly-cut loop points, so instead of native
  // AudioBufferSourceNode looping (which hard-cuts at the buffer's exact start/
  // end and would click/jump on most natural recordings), a fresh copy of the
  // sample is started — and crossfaded in — a few seconds before the current
  // one ends, so the ambience continues without an audible seam. Timing is
  // always derived from the real decoded AudioBuffer's own .duration, never
  // from any external length metadata, so it stays correct automatically even
  // if the underlying file is swapped for a different-length one later.
  const LOOP_CROSSFADE_RATIO = 0.15;  // fraction of the sample's length that overlaps
  const LOOP_CROSSFADE_MIN_SEC = 0.5;
  const LOOP_CROSSFADE_MAX_SEC = 4;

  function crossfadeSeconds(duration) {
    return clamp(duration * LOOP_CROSSFADE_RATIO, LOOP_CROSSFADE_MIN_SEC, Math.min(LOOP_CROSSFADE_MAX_SEC, duration / 2));
  }

  function spawnLoopVoice(key, session) {
    if (!session.active) return;
    const st = sampleState[key];
    const ctx = getAudioCtx();
    const buffer = st.buffer;
    const dur = buffer.duration;
    const fade = crossfadeSeconds(dur);
    const now = ctx.currentTime;

    const voiceGain = ctx.createGain();
    voiceGain.gain.setValueAtTime(0, now);
    voiceGain.gain.linearRampToValueAtTime(1, now + fade);
    voiceGain.gain.setValueAtTime(1, now + (dur - fade)); // hold at full until the fade-out window starts
    voiceGain.gain.linearRampToValueAtTime(0, now + dur);
    voiceGain.connect(st.gain);

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(voiceGain);
    src.start(now);

    const voice = { src, voiceGain };
    session.voices.push(voice);
    src.onended = () => {
      try { src.disconnect(); voiceGain.disconnect(); } catch (e) {}
      const idx = session.voices.indexOf(voice);
      if (idx !== -1) session.voices.splice(idx, 1);
    };

    // Next voice starts exactly when this one begins fading out, so the two overlap.
    session.timerId = setTimeout(() => spawnLoopVoice(key, session), Math.max(dur - fade, 0.05) * 1000);
  }

  function startAmbientLoop(key) {
    const st = sampleState[key];
    const session = { active: true, timerId: null, voices: [] };
    st.loopSession = session;
    spawnLoopVoice(key, session);
  }

  function stopAmbientLoop(key) {
    const st = sampleState[key];
    const session = st.loopSession;
    if (!session) return;
    session.active = false;
    if (session.timerId) clearTimeout(session.timerId);
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const RELEASE_SEC = 0.6; // quick, click-free fade on a manual stop
    session.voices.forEach(v => {
      v.voiceGain.gain.cancelScheduledValues(now);
      v.voiceGain.gain.setValueAtTime(v.voiceGain.gain.value, now);
      v.voiceGain.gain.linearRampToValueAtTime(0, now + RELEASE_SEC);
      try { v.src.stop(now + RELEASE_SEC + 0.05); } catch (e) {}
    });
    st.loopSession = null;
    setPadPlaying(key, false);
  }

  // ── ONE HIT retrigger ────────────────────────────────────────────────────────
  // Same fade-stop-restart toggle as LOOP, for consistency: press 1 plays,
  // press 2 (while still sounding) quickly fades it out and cuts it off,
  // press 3 restarts from the beginning. A far shorter release than the
  // ambient loop's (0.6s would sound sluggish on a short percussive hit).
  function startOneHit(key, buffer) {
    const st = sampleState[key];
    const ctx = getAudioCtx();

    const voiceGain = ctx.createGain();
    voiceGain.gain.value = 1;
    voiceGain.connect(st.gain);

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(voiceGain);

    const voice = { src, voiceGain };
    st.oneHitVoice = voice;
    src.start(0);
    setPadPlaying(key, true);

    src.onended = () => {
      try { src.disconnect(); voiceGain.disconnect(); } catch (e) {}
      // Only clear state if this is still the current voice — a manual stop
      // already nulled it out and started its own fade before this fires.
      if (st.oneHitVoice === voice) {
        st.oneHitVoice = null;
        setPadPlaying(key, false);
      }
    };
  }

  function stopOneHit(key) {
    const st = sampleState[key];
    const voice = st.oneHitVoice;
    if (!voice) return;
    st.oneHitVoice = null;
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const RELEASE_SEC = 0.08; // "quickly fades out" — short and percussive, not the loop's slow release
    voice.voiceGain.gain.cancelScheduledValues(now);
    voice.voiceGain.gain.setValueAtTime(voice.voiceGain.gain.value, now);
    voice.voiceGain.gain.linearRampToValueAtTime(0, now + RELEASE_SEC);
    try { voice.src.stop(now + RELEASE_SEC + 0.02); } catch (e) {}
    setPadPlaying(key, false);
  }

  // ── RETRIGGER ────────────────────────────────────────────────────────────────
  // No fade-stop-restart toggle here (unlike ONE HIT/LOOP) — every tap always
  // fires a brand new instance from the start, but it does NOT stack: each
  // press kills whatever's currently sounding on this pad first, so rapid
  // taps cut each other off rather than layering up voices.
  // Re-pressing a RETRIGGER pad kills whatever's currently sounding on it
  // before starting the new instance — it does not stack. Each voice gets
  // its own tiny gain node purely so a kill can ramp it to silence over a
  // few ms instead of a hard src.stop() click, before the fresh voice starts.
  const RETRIGGER_KILL_FADE_SEC = 0.008;

  function killRetriggerVoices(key) {
    const st = sampleState[key];
    if (!st.retriggerVoices.size) return;
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const voices = Array.from(st.retriggerVoices);
    st.retriggerVoices.clear();
    voices.forEach(src => {
      const g = src._voiceGain;
      if (g) {
        g.gain.cancelScheduledValues(now);
        g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + RETRIGGER_KILL_FADE_SEC);
      }
      try { src.stop(now + RETRIGGER_KILL_FADE_SEC + 0.005); } catch (e) {}
    });
    setPadPlaying(key, false);
  }

  function startRetriggerVoice(key, buffer) {
    const st = sampleState[key];
    const ctx = getAudioCtx();

    killRetriggerVoices(key);

    const voiceGain = ctx.createGain();
    voiceGain.gain.value = 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(voiceGain);
    voiceGain.connect(st.gain);
    src._voiceGain = voiceGain;

    st.retriggerVoices.add(src);
    setPadPlaying(key, true);
    src.start(0);

    src.onended = () => {
      try { src.disconnect(); } catch (e) {}
      try { voiceGain.disconnect(); } catch (e) {}
      st.retriggerVoices.delete(src);
      if (st.retriggerVoices.size === 0) setPadPlaying(key, false);
    };
  }

  // The Sampler must not keep sounding once the user leaves Page 2 — mirrors
  // forceStopPad() on the pad side. Reuses each mode's own quick-fade stop
  // rather than a hard cut, and handles RETRIGGER's overlapping voices with
  // its own short fade via the shared per-sample gain node (RETRIGGER voices
  // have no individual envelope of their own, unlike ONE HIT/LOOP).
  function forceStopAllSamples() {
    SAMPLE_KEYS.forEach(key => {
      const st = sampleState[key];
      if (st.loopSession) stopAmbientLoop(key);
      if (st.oneHitVoice) stopOneHit(key);
      if (st.retriggerVoices.size) {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const FADE_SEC = 0.08;
        const voices = Array.from(st.retriggerVoices);
        st.gain.gain.cancelScheduledValues(now);
        st.gain.gain.setValueAtTime(st.gain.gain.value, now);
        st.gain.gain.linearRampToValueAtTime(0, now + FADE_SEC);
        voices.forEach(src => { try { src.stop(now + FADE_SEC + 0.02); } catch (e) {} });
        st.retriggerVoices.clear();
        setPadPlaying(key, false);
        // Restore the sample's own trim level once the fade's done, ready for next trigger.
        setTimeout(() => {
          const t = getAudioCtx().currentTime;
          st.gain.gain.cancelScheduledValues(t);
          st.gain.gain.setValueAtTime(stepToGain(st.volumeStep), t);
        }, (FADE_SEC + 0.03) * 1000);
      }
    });
  }

  function loadSampleBuffer(key) {
    const st = sampleState[key];
    if (st.buffer) return Promise.resolve(st.buffer);
    if (st.loading) return st.loading;
    const entry = PRESETS[presetIndex]?.[key];
    if (!entry) return Promise.reject(new Error('No manifest entry for this preset/sample'));
    const url = entry.audio;
    st.loading = fetch(url)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
      .then(ab => getAudioCtx().decodeAudioData(ab))
      .then(buf => { st.buffer = buf; st.loading = null; return buf; })
      .catch(err => { st.loading = null; throw err; });
    return st.loading;
  }

  function flashPadError(key) {
    const pad = document.querySelector(`.sample-pad[data-sample="${key}"]`);
    pad.classList.add('error');
    setTimeout(() => pad.classList.remove('error'), 600);
    console.error(`Sample ${key} failed to load`, PRESETS[presetIndex]?.[key]?.audio);
  }

  function setPadPlaying(key, isPlaying) {
    document.querySelector(`.sample-pad[data-sample="${key}"]`).classList.toggle('playing', isPlaying);
  }

  async function triggerSample(key) {
    const st = sampleState[key];
    ensureSampleGain(key);
    getAudioCtx();

    // Second tap while something's already sounding on this pad: fade-stop-reset,
    // same three-state toggle in both modes (LOOP's own release is slower —
    // see stopAmbientLoop/stopOneHit for why).
    if (st.mode === 'LOOP' && st.loopSession) {
      stopAmbientLoop(key);
      return;
    }
    if (st.mode === 'ONE HIT' && st.oneHitVoice) {
      stopOneHit(key);
      return;
    }

    let buffer;
    try {
      buffer = await loadSampleBuffer(key);
    } catch (err) {
      flashPadError(key);
      return;
    }

    ensureMasterClock(); // first-ever sample trigger also starts the master clock

    if (st.mode === 'LOOP') {
      setPadPlaying(key, true);
      startAmbientLoop(key);
    } else if (st.mode === 'RETRIGGER') {
      startRetriggerVoice(key, buffer);
    } else {
      startOneHit(key, buffer);
    }
  }

  function adjustSampleVolume(key, dir) {
    const st = sampleState[key];
    st.volumeStep = clamp(st.volumeStep + (dir === 'up' ? 1 : -1), -VOLUME_STEP_MAX, VOLUME_STEP_MAX);
    ensureSampleGain(key).gain.setTargetAtTime(stepToGain(st.volumeStep), getAudioCtx().currentTime, 0.01);
    updateVolumeButtons(key);
  }

  const SAMPLE_MODES = ['ONE HIT', 'RETRIGGER', 'LOOP'];
  function toggleSampleMode(key) {
    const st = sampleState[key];
    if (st.mode === 'LOOP' && st.loopSession) {
      stopAmbientLoop(key);
    } else if (st.mode === 'ONE HIT' && st.oneHitVoice) {
      stopOneHit(key);
    } else if (st.mode === 'RETRIGGER' && st.retriggerVoices.size) {
      // RETRIGGER has no fade-stop toggle of its own — switching mode
      // mid-ring just kills whatever's currently sounding (same declick as
      // a normal re-press).
      killRetriggerVoices(key);
    }
    const nextIndex = (SAMPLE_MODES.indexOf(st.mode) + 1) % SAMPLE_MODES.length;
    st.mode = SAMPLE_MODES[nextIndex];
    document.querySelector(`.mode-btn[data-sample="${key}"]`).textContent = st.mode;
  }

  document.querySelectorAll('.sample-pad').forEach(btn => {
    btn.addEventListener('click', () => triggerSample(btn.dataset.sample));
  });
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleSampleMode(btn.dataset.sample));
  });
  document.querySelectorAll('.vol-btn').forEach(btn => {
    btn.addEventListener('click', () => adjustSampleVolume(btn.dataset.sample, btn.dataset.dir));
  });

  // ── EQ sweep control (Page 2 sampler only) ──────────────────────────────────
  // A dual-handle band, not a single-thumb fader: the light-blue lines are
  // independent low-cut / high-cut cutoff frequencies (log-mapped 20Hz–20kHz
  // so handle position reads intuitively), the teal fill between them is the
  // passband. Dragging a handle moves that cutoff only; dragging the teal
  // fill itself slides both cutoffs together, preserving their gap, for a
  // manual Q-style sweep. Wired in the audio graph directly before the
  // shared FX chain (after the sampler's mute/width stages).
  // The adjustable range IS the default cut points — 80Hz to 18kHz — so at
  // default the handles sit at the true extreme left/right of the track,
  // not partway in. Moving a handle away from its edge always narrows the
  // passband (there's no "beyond 80Hz down" or "beyond 18kHz up" to sweep to).
  const EQ_MIN_HZ = 80, EQ_MAX_HZ = 18000;
  const eqHzToRatio = hz => Math.log(hz / EQ_MIN_HZ) / Math.log(EQ_MAX_HZ / EQ_MIN_HZ);
  const eqRatioToHz = ratio => EQ_MIN_HZ * Math.pow(EQ_MAX_HZ / EQ_MIN_HZ, ratio);

  // Defaults: strong low-cut at 80Hz, strong high-cut at 18kHz — i.e. ratio 0/1.
  let eqLoRatio = eqHzToRatio(EQ_MIN_HZ);
  let eqHiRatio = eqHzToRatio(EQ_MAX_HZ);
  let eqLoActive = false, eqHiActive = false, eqBandActive = false;
  let eqBandDragStartX = 0, eqBandDragStartLo = 0, eqBandDragStartHi = 0;

  // Two-finger-width minimum gap between the handles, in px — kept as a
  // pixel constant (not a fixed ratio) so it stays a physical, finger-sized
  // gap regardless of how wide the track is rendered.
  const EQ_MIN_GAP_PX = 80;

  function eqMinGapRatio() {
    const rb = eqTrack.getBoundingClientRect();
    const travel = rb.width - FADER_INSET * 2;
    return travel > 0 ? EQ_MIN_GAP_PX / travel : 0;
  }
  function eqPosCSS(ratio) {
    return `calc(${FADER_INSET}px + ${ratio} * (100% - ${FADER_INSET * 2}px))`;
  }

  function updateEQVisual() {
    eqHandleLo.style.left = eqPosCSS(eqLoRatio);
    eqHandleHi.style.left = eqPosCSS(eqHiRatio);
    eqBand.style.left  = eqPosCSS(eqLoRatio);
    // Inset terms cancel between the two handle positions, so the band's
    // width is just the ratio gap scaled over the same travel distance.
    eqBand.style.width = `calc(${eqHiRatio - eqLoRatio} * (100% - ${FADER_INSET * 2}px))`;
  }

  function applyEQ() {
    const ctx = audioCtx;
    if (!ctx?._eqReady) return;
    const loHz = eqRatioToHz(eqLoRatio);
    const hiHz = eqRatioToHz(eqHiRatio);
    const t = ctx.currentTime;
    ctx._eqHPF1.frequency.setTargetAtTime(loHz, t, 0.02);
    ctx._eqHPF2.frequency.setTargetAtTime(loHz, t, 0.02);
    ctx._eqLPF1.frequency.setTargetAtTime(hiHz, t, 0.02);
    ctx._eqLPF2.frequency.setTargetAtTime(hiHz, t, 0.02);
  }

  function setEQLo(ratio) {
    eqLoRatio = clamp(ratio, 0, eqHiRatio - eqMinGapRatio());
    updateEQVisual();
    applyEQ();
  }
  function setEQHi(ratio) {
    eqHiRatio = clamp(ratio, eqLoRatio + eqMinGapRatio(), 1);
    updateEQVisual();
    applyEQ();
  }
  function dragEQBand(clientX) {
    const rb = eqTrack.getBoundingClientRect();
    const travel = rb.width - FADER_INSET * 2;
    if (travel <= 0) return;
    const deltaRatio = (clientX - eqBandDragStartX) / travel;
    const gap = eqBandDragStartHi - eqBandDragStartLo;
    let newLo = clamp(eqBandDragStartLo + deltaRatio, 0, 1 - gap);
    eqLoRatio = newLo;
    eqHiRatio = newLo + gap;
    updateEQVisual();
    applyEQ();
  }

  updateEQVisual();

  eqHandleLo.addEventListener('mousedown', e => {
    eqLoActive = true; e.stopPropagation(); e.preventDefault();
  });
  eqHandleHi.addEventListener('mousedown', e => {
    eqHiActive = true; e.stopPropagation(); e.preventDefault();
  });
  eqBand.addEventListener('mousedown', e => {
    eqBandActive = true;
    eqBandDragStartX = e.clientX; eqBandDragStartLo = eqLoRatio; eqBandDragStartHi = eqHiRatio;
    e.stopPropagation();
  });
  window.addEventListener('mousemove', e => {
    if (eqLoActive)   setEQLo(trackRatio(eqTrack, e.clientX));
    if (eqHiActive)   setEQHi(trackRatio(eqTrack, e.clientX));
    if (eqBandActive) dragEQBand(e.clientX);
  });
  window.addEventListener('mouseup', () => {
    eqLoActive = false; eqHiActive = false; eqBandActive = false;
  });

  eqHandleLo.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation(); eqLoActive = true;
  }, { passive: false });
  eqHandleLo.addEventListener('touchmove', e => {
    e.preventDefault(); setEQLo(trackRatio(eqTrack, e.touches[0].clientX));
  }, { passive: false });
  eqHandleLo.addEventListener('touchend', () => { eqLoActive = false; });

  eqHandleHi.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation(); eqHiActive = true;
  }, { passive: false });
  eqHandleHi.addEventListener('touchmove', e => {
    e.preventDefault(); setEQHi(trackRatio(eqTrack, e.touches[0].clientX));
  }, { passive: false });
  eqHandleHi.addEventListener('touchend', () => { eqHiActive = false; });

  eqBand.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    eqBandActive = true;
    eqBandDragStartX = e.touches[0].clientX; eqBandDragStartLo = eqLoRatio; eqBandDragStartHi = eqHiRatio;
  }, { passive: false });
  eqBand.addEventListener('touchmove', e => {
    e.preventDefault(); dragEQBand(e.touches[0].clientX);
  }, { passive: false });
  eqBand.addEventListener('touchend', () => { eqBandActive = false; });

  // ── EQ audio stage — cascaded pairs (24dB/oct) for a genuinely strong
  // rolloff at each cutoff, sitting directly before the shared FX chain. ───
  function ensureSamplerEQStage() {
    const ctx = getAudioCtx();
    if (ctx._eqReady) return;
    const hpf1 = ctx.createBiquadFilter(); hpf1.type = 'highpass'; hpf1.Q.value = 0.707;
    const hpf2 = ctx.createBiquadFilter(); hpf2.type = 'highpass'; hpf2.Q.value = 0.707;
    const lpf1 = ctx.createBiquadFilter(); lpf1.type = 'lowpass';  lpf1.Q.value = 0.707;
    const lpf2 = ctx.createBiquadFilter(); lpf2.type = 'lowpass';  lpf2.Q.value = 0.707;
    hpf1.connect(hpf2); hpf2.connect(lpf1); lpf1.connect(lpf2); lpf2.connect(ctx._fxInput);
    ctx._eqInput = hpf1;
    ctx._eqHPF1 = hpf1; ctx._eqHPF2 = hpf2; ctx._eqLPF1 = lpf1; ctx._eqLPF2 = lpf2;
    ctx._eqReady = true;
    applyEQ();
  }
</script>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/xsmini/service-worker.js');
  }
</script>
